name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match version $version in Resources/Info.plist"
            exit 1
          fi

      - run: swift test

      - run: scripts/build-app --universal

      - name: Package
        working-directory: build
        run: |
          ditto -c -k --sequesterRsrc --keepParent Relevo.app Relevo.zip
          shasum -a 256 Relevo.zip > Relevo.zip.sha256
          cat Relevo.zip.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: build/Relevo.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" build/Relevo.zip build/Relevo.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Relevo $TAG" \
            --notes-file .github/release-notes.md --generate-notes

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Relevo
          path: |
            build/Relevo.zip
            build/Relevo.zip.sha256
          retention-days: 3
